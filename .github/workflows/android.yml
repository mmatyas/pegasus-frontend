name: Build - Android
on: [push, pull_request, workflow_dispatch]

env:
  TOOLS_URL: https://github.com/mmatyas/pegasus-frontend/releases/download/alpha1
  QT_TARGET: android
  QT_VERSION: qt51510
  QT_VERSION_PRETTY: "5.15.10"


jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: android
            abi: armeabi-v7a
          - name: android64
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive', fetch-depth: 0, fetch-tags: true}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Install Qt
        run: |
          .circleci/prepare.sh
          curl -L ${TOOLS_URL}/openssl-111t_android.tar.xz | tar xJf - -C /opt/

      - name: Patch Qt Android focus highlight
        run: |
          set -euxo pipefail
          qt_root="/opt/${QT_VERSION}_${QT_TARGET}"
          qt_android_jar="${qt_root}/jar/QtAndroid.jar"
          qt_source_root="${RUNNER_TEMP}/qtbase"
          qt_package_dir="${qt_source_root}/src/android/jar/src/org/qtproject/qt5/android"
          qt_classes="${RUNNER_TEMP}/qt-android-classes"
          android_jar="$(find "${ANDROID_HOME}/platforms" -mindepth 2 -maxdepth 2 \
            -name android.jar -print | sort -V | tail -n 1)"

          test -f "${qt_android_jar}"
          test -f "${android_jar}"
          mkdir -p "${qt_package_dir}" "${qt_classes}"
          curl --fail --location --retry 3 \
            --output "${qt_package_dir}/QtEditText.java" \
            "https://raw.githubusercontent.com/qt/qtbase/v${QT_VERSION_PRETTY}-lts-lgpl/src/android/jar/src/org/qtproject/qt5/android/QtEditText.java"
          patch --batch --forward --strip=1 --directory="${qt_source_root}" \
            < "${GITHUB_WORKSPACE}/etc/patches/qt-5.15.10-android-disable-focus-highlight.patch"
          javac -source 8 -target 8 \
            -classpath "${qt_android_jar}:${android_jar}" \
            -d "${qt_classes}" \
            "${qt_package_dir}/QtEditText.java"
          jar --update --file "${qt_android_jar}" \
            -C "${qt_classes}" org/qtproject/qt5/android/QtEditText.class
          javap -classpath "${qt_android_jar}" -c org.qtproject.qt5.android.QtEditText \
            | grep -F 'setDefaultFocusHighlightEnabled'

      - name: Build
        env:
          BUILDOPTS: ANDROID_ABIS=${{ matrix.abi }} FORCE_QT_PNG=1
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: .circleci/build.sh

      - name: Package (debug)
        if: (github.event_name != 'push' && github.event_name != 'workflow_dispatch') || github.ref != 'refs/heads/master'
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: /opt/${QT_VERSION}_${QT_TARGET}/bin/androiddeployqt
          --input src/app/android-pegasus-fe-deployment-settings.json
          --output ${PWD}/installdir
          --android-platform android-30
          --gradle
      - name: Package (debug), stage
        if: (github.event_name != 'push' && github.event_name != 'workflow_dispatch') || github.ref != 'refs/heads/master'
        run: cp
          installdir/build/outputs/apk/debug/installdir-debug.apk
          dist/pegasus-fe_$(git describe --always)_${{ matrix.name }}.apk

      - name: Package (release), prep
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          curl -LO https://github.com/mmatyas/pegasus-frontend/releases/download/alpha1/aks.enc
          openssl aes-256-cbc -k "${{ secrets.AKS_ENC_KEY }}" -in aks.enc -out aks -d
      - name: Package (release)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: /opt/${QT_VERSION}_${QT_TARGET}/bin/androiddeployqt
          --input src/app/android-pegasus-fe-deployment-settings.json
          --output ${PWD}/installdir
          --android-platform android-30
          --gradle
          --sign ./aks "${{ secrets.AKS_ALIAS }}"
          --storepass "${{ secrets.AKS_STOREPASS }}"
          --keypass "${{ secrets.AKS_KEYPASS }}"
      - name: Package (release), stage
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: cp
          installdir/build/outputs/apk/release/installdir-release-signed.apk
          dist/pegasus-fe_$(git describe --always)_${{ matrix.name }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist

      - name: Deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: mmatyas/pegasus-deploy-staging
          personal_token: ${{ secrets.PEGASUS_GHACTIONS_TOKEN }}
          publish_branch: continuous-${{ matrix.name }}
          publish_dir: ./dist
          force_orphan: true
